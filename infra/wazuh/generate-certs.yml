# 인증서를 Docker 볼륨 haedam_wazuh-certs에 바로 만든다(Windows 바인드 마운트는 키 파일 권한 문제가 있음).
#   docker volume create haedam_wazuh-certs
#   docker compose -f infra/wazuh/generate-certs.yml run --rm generator
services:
  generator:
    image: wazuh/wazuh-certs-generator:0.0.2
    hostname: wazuh-certs-generator
    volumes:
      - wazuh-certs:/certificates/
      - ./config/certs.yml:/config/certs.yml:ro
volumes:
  wazuh-certs:
    external: true
    name: haedam_wazuh-certs
