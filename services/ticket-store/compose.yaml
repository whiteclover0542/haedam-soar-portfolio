# C PC ticket store. Key comes from .env next to this file (not committed, see .env.example).
# Untested on C PC: VPN-address binding needs the VPN up; check with a real connection, not only `docker port`.
services:
  ticket-store:
    build: .
    container_name: ticket-store
    restart: unless-stopped
    env_file: .env
    environment:
      TICKET_STORE_DB: /data/tickets.db
    ports:
      - "${TICKET_BIND_IP:-10.250.0.3}:8088:8088"   # approved private interface; key + firewall required
      - "127.0.0.1:8089:8089"    # dashboard, C PC browser only
    volumes:
      - ticket-data:/data
    mem_limit: 256m

volumes:
  ticket-data:
