# 해담시청 SOAR — PC 한 대 구성. 주소 표: docs/MVP-구현계획.md
# 팀 4대 분산 환경의 주소를 그대로 쓴다: wan = 공격자·시민 쪽(203.0.113.0/24), lan = 옛 팀 VPN 대역(10.250.0.0/24).
name: haedam

networks:
  wan:
    ipam: {config: [{subnet: 203.0.113.0/24, gateway: 203.0.113.254}]}
    # 끄지 않으면 Docker가 lan으로 포워딩된 203.0.113.x 출발지를 게이트웨이 주소로 바꿔
    # 출발지 보존이 깨진다. 대신 wan 컨테이너는 인터넷에 못 나간다(도구는 빌드 때 설치).
    driver_opts: {com.docker.network.bridge.enable_ip_masquerade: "false"}
  lan:
    ipam: {config: [{subnet: 10.250.0.0/24, gateway: 10.250.0.254}]}
  console: {}   # pfSense 설치 콘솔(VNC 웹)만 쓰는 망

volumes:
  pfsense-data:
  portal-db:
  ticket-data:
  mongo-data:
  opensearch-data:
  graylog-data:
  wazuh-api-configuration:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  filebeat-etc:
  filebeat-var:
  wazuh-indexer-data:
  wazuh-certs:
  n8n-data:

services:
  # ── 서버: 포털(원작 A)·MySQL·티켓 저장소(원작 C) ──
  portal-db:
    image: mysql:8.4
    container_name: haedam-portal-db
    environment:
      MYSQL_DATABASE: haedam
      MYSQL_USER: haedam
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      lan: {ipv4_address: 10.250.0.5}
    volumes: [portal-db:/var/lib/mysql]
    mem_limit: 512m
    restart: unless-stopped

  portal:
    build: services/portal
    container_name: haedam-portal
    cap_add: [NET_ADMIN]   # entrypoint의 복귀 경로(203.0.113.0/24 via pfSense)
    environment:
      DATABASE_URL: mysql+pymysql://haedam:${MYSQL_PASSWORD}@10.250.0.5/haedam?charset=utf8mb4
      GELF_ENABLED: "1"
      GELF_HOST: 10.250.0.100
      GELF_TRANSPORT: tcp
      RESPONSE_API_KEY: ${PORTAL_RESPONSE_KEY:?.env}
      RESPONSE_ALLOWED_CIDRS: 10.250.0.103/32
      DASHBOARD_URL: http://127.0.0.1:8089
      PORTAL_ADMIN_USERNAME: ${PORTAL_ADMIN_USERNAME:?.env}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:?.env}
    networks:
      lan: {ipv4_address: 10.250.0.2}
    ports: ["127.0.0.1:8080:5000"]
    depends_on: [portal-db]
    mem_limit: 384m
    restart: unless-stopped

  ticket-store:
    build: services/ticket-store
    container_name: haedam-ticket-store
    environment:
      TICKET_STORE_KEY: ${TICKET_STORE_KEY:?.env}
      DASHBOARD_ORIGIN: http://127.0.0.1:8089
    networks:
      lan: {ipv4_address: 10.250.0.3}
    ports: ["127.0.0.1:8089:8089"]   # 대시보드만. n8n API 8088은 lan 안에서만
    volumes: [ticket-data:/data]
    mem_limit: 256m
    restart: unless-stopped

  # ── Graylog (원작 compose·규칙: D·B, 단일 PC 조정: A). 설정 반입: infra/graylog/bootstrap.py ──
  mongodb:
    image: mongo:6.0.28
    container_name: haedam-mongodb
    profiles: [soc]
    networks:
      lan: {ipv4_address: 10.250.0.102}
    volumes: [mongo-data:/data/db]
    mem_limit: 512m
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.5.0   # 2.15는 색인 오류(팀 수업 메모)
    container_name: haedam-opensearch
    profiles: [soc]
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx768m
      discovery.type: single-node
      action.auto_create_index: "false"
      plugins.security.disabled: "true"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    networks:
      lan: {ipv4_address: 10.250.0.101}
    volumes: [opensearch-data:/usr/share/opensearch/data]
    mem_limit: 1536m
    restart: unless-stopped

  graylog:
    image: graylog/graylog:6.1.16
    container_name: haedam-graylog
    profiles: [soc]
    depends_on: [mongodb, opensearch]
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:?.env}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:?.env}
      GRAYLOG_HTTP_EXTERNAL_URI: http://127.0.0.1:9000/
      GRAYLOG_MONGODB_URI: mongodb://10.250.0.102:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://10.250.0.101:9200
      GRAYLOG_ROOT_TIMEZONE: Asia/Seoul
      GRAYLOG_SERVER_JAVA_OPTS: -Xms1g -Xmx1g
    # 입력(GELF TCP 12201·Syslog UDP 1514·Raw TCP 5514)은 lan에서 직접 받으므로 호스트에 열지 않는다.
    networks:
      lan: {ipv4_address: 10.250.0.100}
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - graylog-data:/usr/share/graylog/data/journal
      - ./infra/graylog/lookup:/usr/share/graylog/data/lookup:ro
    mem_limit: 1536m
    restart: unless-stopped

  # ── n8n (원작 워크플로: D 외, 단일 PC 반입: A). 반입: infra/n8n/load.py ──
  n8n:
    image: n8nio/n8n:2.39.5
    container_name: haedam-n8n
    profiles: [soc]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?.env}
      WEBHOOK_URL: http://10.250.0.103:5678/
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      N8N_SECURE_COOKIE: "false"   # http://127.0.0.1:5678 로그인용
      N8N_DIAGNOSTICS_ENABLED: "false"
    networks:
      lan: {ipv4_address: 10.250.0.103}
    ports: ["127.0.0.1:5678:5678"]
    volumes: [n8n-data:/home/node/.n8n]
    mem_limit: 768m
    restart: unless-stopped

  # ── pfSense (원작 규칙·도구: B, 컨테이너화: A) ──
  pfsense:
    build: infra/pfsense
    container_name: haedam-pfsense
    profiles: [pfsense]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun, /dev/kvm]
    networks:
      wan: {ipv4_address: 203.0.113.1}
      lan: {ipv4_address: 10.250.0.1}
      console: {gw_priority: 100}   # 포트 게시·기본 경로는 이 망으로
    ports: ["127.0.0.1:8006:8006"]
    volumes:
      - pfsense-data:/data
      - ./infra/pfsense/iso:/iso:ro
    mem_limit: 1280m
    restart: unless-stopped

  pf-ui:   # 호스트 브라우저 → pfSense 웹(443)·SSH(22) 중계
    image: haedam/socat
    build:
      context: infra/pfsense
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache socat
    container_name: haedam-pf-ui
    profiles: [pfsense]
    command: sh -c "socat TCP-LISTEN:8443,fork,reuseaddr TCP:10.250.0.1:443 & exec socat TCP-LISTEN:2222,fork,reuseaddr TCP:10.250.0.1:22"
    networks:
      lan: {ipv4_address: 10.250.0.10}
    ports: ["127.0.0.1:8443:8443", "127.0.0.1:2222:2222"]
    mem_limit: 32m
    restart: unless-stopped

  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: haedam-wazuh-manager
    hostname: wazuh.manager
    profiles: [wazuh]
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 655360, hard: 655360}
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:?.env}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/wazuh/root-ca-manager.pem
      SSL_CERTIFICATE: /etc/ssl/wazuh/wazuh.manager.pem
      SSL_KEY: /etc/ssl/wazuh/wazuh.manager-key.pem
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?.env}
    networks: {lan: {ipv4_address: 10.250.0.4}}
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - filebeat-etc:/etc/filebeat
      - filebeat-var:/var/lib/filebeat
      - wazuh-certs:/etc/ssl/wazuh:ro
    mem_limit: 1g
    restart: unless-stopped

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.2
    container_name: haedam-wazuh-indexer
    hostname: wazuh.indexer
    profiles: [wazuh]
    environment: {OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g}
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    networks: {lan: {ipv4_address: 10.250.0.6}}
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - wazuh-certs:/usr/share/wazuh-indexer/certs:ro   # 인증서: infra/wazuh/generate-certs.yml
      - ./infra/wazuh/config/wazuh_indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ./infra/wazuh/config/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro   # make_users.py
    mem_limit: 1536m
    restart: unless-stopped

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    container_name: haedam-wazuh-dashboard
    hostname: wazuh.dashboard
    profiles: [wazuh]
    environment:
      OPENSEARCH_HOSTS: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:?.env}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:?.env}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?.env}
    ports: ["127.0.0.1:5601:5601"]
    networks: {lan: {ipv4_address: 10.250.0.7}}
    volumes:
      - wazuh-certs:/usr/share/wazuh-dashboard/certs:ro
      - ./infra/wazuh/config/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    depends_on: [wazuh.indexer, wazuh.manager]
    mem_limit: 768m
    restart: unless-stopped

  # ── 실습용 출발지 (wan). attacker는 별칭 .21·.22를 더 갖는다 ──
  attacker:
    build: lab
    image: haedam/lab
    container_name: haedam-attacker
    profiles: [lab]
    cap_add: [NET_ADMIN]
    command: sh -c "ip addr add 203.0.113.21/24 dev eth0 && ip addr add 203.0.113.22/24 dev eth0 && exec sleep infinity"
    networks:
      wan: {ipv4_address: 203.0.113.11}
    mem_limit: 128m
    restart: unless-stopped

  normal:
    build: lab
    image: haedam/lab
    container_name: haedam-normal
    profiles: [lab]
    networks:
      wan: {ipv4_address: 203.0.113.100}
    mem_limit: 128m
    restart: unless-stopped
